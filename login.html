<body>
   <div class="container"></div>
   <form method="post" class="box">
    <div class="header">
        <h2>Account Login</h2>
    </div>
    <div class="login-area">
        <input id="user-email" class="Username" type="Email" name="Email" autocomplete="on"  placeholder="Username..." required/>

        <a href="#">Create Account</a>
    </div>
</form>
</body>
